name: Scan published package

# Runs n8n's community package scanner against the version published on npm
# (provenance, attested source, lint). Run after each release, before
# submitting to the n8n Creator Portal.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to scan (default: latest)'
        required: false
        default: ''
      scanner:
        description: 'Scanner dist-tag (latest or beta; the n8n Creator Portal uses beta)'
        required: false
        default: 'beta'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Scan
        # The scanner exits with 0 even when checks fail, so fail on its report instead.
        run: |
          npx -y "@n8n/scan-community-package@${SCANNER:-beta}" "n8n-nodes-flowcore${VERSION:+@$VERSION}" 2>&1 | tee scan.log
          ! grep -q 'has failed security checks' scan.log
        env:
          VERSION: ${{ inputs.version }}
          SCANNER: ${{ inputs.scanner }}
